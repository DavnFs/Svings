org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compilation stores cache keys as paths relative to the
# Android project. The pub cache lives on C: and this project on D:, so that
# relative-path computation throws (IllegalArgumentException: different roots)
# and plugin Kotlin compilation fails. Disabling the incremental cache avoids
# it. Re-enable if the pub cache and the project ever share a drive.
kotlin.incremental=false
